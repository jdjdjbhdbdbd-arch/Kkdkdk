
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip project
        run: |
          mkdir -p project

          if [ -f "AstralEchoAndroid_Enhanced.zip" ]; then
            ARCHIVE="AstralEchoAndroid_Enhanced.zip"
          elif [ -f "AstralEchoAndroid_CloudBuild.zip" ]; then
            ARCHIVE="AstralEchoAndroid_CloudBuild.zip"
          else
            echo "ERROR: Project ZIP archive not found!"
            ls -la
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          unzip -q -o "$ARCHIVE" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            find project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstralEcho-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
